name: Collect FPL Draft state

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Collect and publish JSON
        env:
          FPL_DRAFT_ENTRY_ID: "336654"
          FPL_DRAFT_LEAGUE_ID: ${{ vars.FPL_DRAFT_LEAGUE_ID }}
          FPL_PLANNING_HORIZON: "4"
        run: fpl-toolkit --publish
      - name: Commit generated public report
        run: |
          if git diff --quiet -- public/data/latest.json data/state/ownership.json; then
            echo "No public report change"
            exit 0
          fi
          git config user.name "fpl-toolkit-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/data/latest.json data/state/ownership.json
          git commit -m "Update FPL Draft snapshot"
          git push

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy latest snapshot to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
