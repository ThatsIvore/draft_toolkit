<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#37003c">
  <title>Draft Toolkit</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand-wrap">
      <div class="brand-mark">DT</div>
      <div>
        <div class="eyebrow">FPL Draft</div>
        <h1>Season Toolkit</h1>
      </div>
    </div>
    <div id="updated" class="updated">Loading latest league snapshot…</div>
  </header>

  <main>
    <section id="hero" class="hero"></section>
    <nav class="tabs" aria-label="Toolkit views">
      <button class="tab active" data-view="squad">My Team</button>
      <button class="tab" data-view="available">Available</button>
      <button class="tab" data-view="activity">League Activity</button>
      <button class="tab" data-view="planner">Planner</button>
    </nav>

    <section id="controls" class="controls"></section>
    <section id="content" class="content"></section>
  </main>

  <footer>
    Independent FPL Draft decision-support project. Not affiliated with the Premier League.
  </footer>
  <script src="app.js"></script>
</body>
</html>
