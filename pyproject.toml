[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fpl-season-toolkit"
version = "0.1.0"
description = "FPL and FPL Draft decision-support toolkit"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
fpl-toolkit = "fpl_toolkit.cli:main"
fpl-toolkit-runner = "fpl_toolkit.standard_fpl_runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
